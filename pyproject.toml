[project]
name = "km0-runner"
version = "0.2.0"
description = "Runs KM0 task packages with pi on a ladder of model tiers, escalates on trajectory signals, and reports back for KM0 acceptance and routing calibration."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
swebench = ["swebench>=4"]
dev = ["pytest>=8"]

[project.scripts]
km0-runner = "km0_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/km0_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
