# Tier ladder for a cascade run. Model names go to mini-swe-agent (LiteLLM names, e.g. "openai/…",
# "anthropic/…", "openrouter/…"). The three models are picked in stage 0 by price and baseline results.
tiers:
  T1:
    model_name: openai/CHEAP-MODEL
    step_limit: 40
    cost_limit: 0.5
  T2:
    model_name: openai/MID-MODEL
    step_limit: 60
    cost_limit: 1.5
  T3:
    model_name: anthropic/STRONG-MODEL
    step_limit: 100
    cost_limit: 4.0

# Starting guesses; tuned on the dev set in stage 1.
signals:
  test_fail_streak: 3
  same_file_edits: 5
  repeat_command: 3
  escalate_on_failed_submit: true

# discard (default) · full · restart
handoff: discard

# mini-swe-agent config the prompts come from: swebench.yaml for SWE-bench, default.yaml for KM0 tasks.
agent_config: swebench.yaml
