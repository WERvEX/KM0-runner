name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # KM0 starts the Runner on all three; Windows stops a run through the STOP file.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The pinned pi, for the end-to-end test against the scripted bridge.
      - run: npm install -g @earendil-works/pi-coding-agent@1.3.0
      - run: pip install -e ".[dev]"
      - run: pytest
